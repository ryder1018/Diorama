# Publishes the sample showcases (wsl-cv/showcase/) as the live demo on GitHub Pages.
name: Deploy showcase to Pages

on:
  push:
    branches: [main]
    paths:
      - "wsl-cv/showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wsl-cv/showcase
      - id: deployment
        uses: actions/deploy-pages@v4
